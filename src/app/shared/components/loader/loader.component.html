@if (isLoading) {
<div class="loader-overlay">
  <div class="loader-content">
    <mat-spinner diameter="60" color="primary"></mat-spinner>
    <p *ngIf="message" class="loader-message">{{ message }}</p>
    <p *ngIf="!message" class="loader-message">Cargando...</p>
    <!-- Mensaje por defecto -->
  </div>
</div>
}
