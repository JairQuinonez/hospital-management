<div class="form">
  <div style="display: flex; justify-content: center; align-items: center">
    <h3 class="login-text">
      {{ title() }}
    </h3>
  </div>
  <br />
  <br />
  <app-medical-historial-form
    [fields]="userProfileFields"
    [initialData]="null"
    [isViewMode]="false"
    [formLayoutCols]="1"
    (formSubmit)="onSubmitForm($event)"
    submitButtonText="Acceder"
    [showCancelButton]="false"
    fieldAppearance="outline"
    [loginGeneral]="isGeneralLogin()"
    (formSubmitGoogle)="onLoginGoogle()"
    [loginDoctor]="isDoctorLogin()"
  >
  </app-medical-historial-form>
</div>
