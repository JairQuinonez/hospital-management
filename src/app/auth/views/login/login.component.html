  logoUrl="/assets/svgs/logo_clinic.svg"

  logoHorizontalAlign="left"
  logoVerticalAlign="top"
  nameHorizontalAlign="left"
  nameVerticalAlign="bottom"
>

      <app-login-cover

        imageUrl="assets/svgs/login-doctor-image.svg"

      />
    </div>
  </div>
